name: CI
on:
  pull_request:
  # The delivery branches are the PR base while `main` is untouched: a merge into one runs the full
  # mutation pass, whose incremental report seeds the cache the next PRs against it restore.
  push:
    branches: [main, 'feature/entrega-*', 'final-project-*']
# A new push to a PR cancels the run of the previous head; pushes to a base branch always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  # Decides whether `quality`, `mutation` and `verify` run. A push to an open PR that only touches
  # documentation (openspec/**, docs/**, *.md) skips them, as long as all three were green (or
  # themselves skipped) on the previous head: e.g. the /opsx:archive commit. A job skipped by `if:` counts as passed for
  # required checks. paths-filter cannot do this: on pull_request it always diffs the whole PR.
  # Never skipped: PR opened/reopened, pushes to main, force-pushes, or a previous head that was not
  # green — so a docs-only push can never hide an earlier failure.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            code_files=$(printf '%s\n' "$changed" | grep -vE '^(openspec/|docs/)|\.md$' | grep . || true)
            green=true
            for job in quality mutation verify; do
              previous=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?check_name=$job" --jq '.check_runs[0].conclusion' 2>/dev/null || true)
              echo "Previous $job: ${previous:-unknown}"
              case "$previous" in success|skipped) ;; *) green=false ;; esac
            done
            if [ -n "$changed" ] && [ -z "$code_files" ] && [ "$green" = true ]; then
              code=false
            fi
            echo "Changed since $BEFORE:"; printf '%s\n' "$changed"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  quality:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # runtime: full monorepo (PATH_SOURCE = packages), not just an app/.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            runtime:
              - 'packages/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.dependency-cruiser.cjs'
              - 'vitest.config.*'
              - 'vitest.stryker.config.*'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - '.github/workflows/ci.yml'
              # The kit hooks are tested by tests/harness (autonomous-run-switch, design D15).
              - '.claude/hooks/**'
              - '.claude/settings.json'
              - '.claude/sdd-harness.env'
              - '.claude/doctor.sh'
              - '.cursor/hooks.json'
              - 'ai-specs/templates/autonomous/**'
              - 'ai-specs/skills/verify-against-spec/**'
              - 'ai-specs/skills/adversarial-review/**'
              - '.claude/skills/verify-against-spec/**'
              - '.claude/skills/adversarial-review/**'
              - '.cursor/skills/verify-against-spec/**'
              - '.cursor/skills/adversarial-review/**'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The dependency rule is the central assertion of a hexagonal
      # architecture. Without this step it is a promise; with it, it is a constraint.
      - name: Dependency rule (core does not import infrastructure)
        run: npx depcruise --config .dependency-cruiser.cjs packages

      - name: Migrations (apply and roll back)
        if: steps.changes.outputs.runtime == 'true'
        run: npm run db:migrate && npm run db:rollback && npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      - name: Tests
        if: steps.changes.outputs.runtime == 'true'
        run: npx vitest run
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      # The hooks must decide long inputs well inside their 10 s timeout. Timed one file at a time, so
      # the figure measures the hook and not the load of the parallel suite (autonomous-run-switch).
      - name: Hook timing
        if: steps.changes.outputs.runtime == 'true'
        run: npx vitest run --no-file-parallelism tests/harness/paths-node.spec.ts tests/harness/secrets-round4.spec.ts tests/harness/paths-round6.spec.ts tests/harness/paths-round7.spec.ts
        env:
          HOOK_TIMING: '1'

  # `npm run verify` (DIS-44) on a database of its own (PH-23): the seed and the golden answers are
  # loaded into `verify`, never into the `test` database of `quality`, whose integration tests assume
  # it holds no seed. No `LLM_*` variable: verify answers from the golden cache with an evaluation
  # model and never calls one. A stale seed or golden fingerprint fails here until the author runs
  # `npm run seed:build` then `npm run cache:build` locally (docs/project-context.md -> Gotchas).
  verify:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/verify

      - name: Seed and golden answers
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/verify

      - name: Verify the golden answers
        run: npm run verify
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/verify

  # Mutation testing, its own job so it runs in parallel with `quality` (it needs no Postgres).
  # Incremental (`"incremental": true` in stryker.config.json): only mutants whose code or covering
  # tests changed run again; the rest reuse reports/stryker-incremental.json, restored from the
  # cache of this branch, else of the PR base branch. A push to a base branch runs everything
  # (`test:mutation:full`, i.e. --force) and saves the report the next PRs start from. The cache key
  # hashes the lock file and the Stryker/Vitest configs: incremental mode cannot see those change.
  mutation:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 30 min was too tight for a branch whose incremental cache has no hit yet (DIS-26: the
    # mutation step alone finished in 29m34s, and the job was cancelled mid cache-save at the
    # 30 min mark even though its score, 95.64, was already above the break threshold).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # business: PATH_BUSINESS (packages/core) + packages/cli (DIS-86) + packages/api (DIS-76) +
      # packages/adapters/llm/src/long-fetch.ts (DIS-103: the one adapter file Stryker mutates) +
      # Stryker/Vitest config + tests/** + dependencies + this workflow.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            business:
              - 'packages/core/**'
              - 'packages/cli/**'
              - 'packages/api/**'
              - 'packages/adapters/llm/src/long-fetch.ts'
              - 'tests/**'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - 'vitest.config.*'
              - 'vitest.stryker.config.*'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.business == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.business == 'true'
        run: npm ci

      - name: Restore the incremental mutation report
        if: steps.changes.outputs.business == 'true'
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ hashFiles('package-lock.json', 'stryker.config.json', 'vitest.config.ts', 'vitest.stryker.config.ts') }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ hashFiles('package-lock.json', 'stryker.config.json', 'vitest.config.ts', 'vitest.stryker.config.ts') }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ hashFiles('package-lock.json', 'stryker.config.json', 'vitest.config.ts', 'vitest.stryker.config.ts') }}-${{ github.base_ref }}-

      # The hard gate is the mutation score (`thresholds.break` 80 in stryker.config.json: a lower
      # score fails the job), not coverage: requiring a coverage
      # percentage fabricates empty tests. Coverage is published as a signal.
      # Skips cleanly until the first test exists: Stryker's dry run fails with
      # zero tests, and fabricating an empty test to force it green is exactly
      # what this gate is meant to prevent. It self-activates once tests land.
      # tests/integration/** is ignored here and in Stryker's own vitest config
      # (vitest.stryker.config.ts): those specs need Postgres (or spawn processes), which this
      # job does not have; the mutated core, cli and api sources and the LLM adapter's long-fetch.ts
      # are covered by the unit specs.
      - name: Mutation testing on critical paths
        if: steps.changes.outputs.business == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if find packages tests -path tests/integration -prune -o \( -name '*.test.*' -o -name '*.spec.*' \) -print 2>/dev/null | grep -q .; then
            if [ "$EVENT" = push ]; then npm run test:mutation:full; else npm run test:mutation; fi
          else
            echo "WARNING: no test files yet — skipping mutation testing until tests exist (Ticket 1/2)."
          fi

  # Secret scan with gitleaks (DIS-87). Its own job on purpose: it has no `needs: scope` and no `if`,
  # because `scope` skips `quality` on docs-only pushes and a secret pasted into a `.md` is exactly
  # what this job must catch. No `npm ci`: a fresh checkout has no node_modules or untracked files
  # for `gitleaks dir` to trip on. Known synthetic findings are allowed by exact value in
  # `.gitleaks.toml` (passed explicitly, so deleting it fails the job); historical ones are
  # fingerprinted by commit in `.gitleaksignore` (see fixtures/README.md). Event values reach the
  # shell through `env:`, never inside `run:`.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official release binary, checked against the SHA-256 of the release checksums.txt, written
      # here (never downloaded in the same step). Installed outside the checkout so `dir .` does not
      # scan it.
      - name: Install gitleaks 8.30.1 (pinned SHA-256)
        id: install
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # PR: base..head. Push to main: before..sha, or tree only when `before` is all zeros (first
      # push) or not a reachable commit (force-push). Never fails for lack of a range.
      - name: Commit range of this event
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range=
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$EVENT" = push ]; then
            if printf '%s' "$BEFORE" | grep -qE '^0+$' || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No usable 'before' commit (${BEFORE:-none}): tree scan only"
            else
              range="$BEFORE..$SHA"
            fi
          else
            echo "Event $EVENT has no commit range: tree scan only"
          fi
          echo "range=$range" | tee -a "$GITHUB_OUTPUT"

      - name: Scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner -v

      # Runs even when the tree scan failed, so one run reports both modes.
      - name: Scan commits of the event
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.range.outputs.range != '' }}
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner -v --log-opts="$RANGE"
