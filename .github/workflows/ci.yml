name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  # Decides whether `quality` runs. A push to an open PR that only touches documentation
  # (openspec/**, docs/**, *.md) skips it, as long as `quality` was green (or itself skipped) on the
  # previous head: e.g. the /opsx:archive commit. A job skipped by `if:` counts as passed for
  # required checks. paths-filter cannot do this: on pull_request it always diffs the whole PR.
  # Never skipped: PR opened/reopened, pushes to main, force-pushes, or a previous head that was not
  # green — so a docs-only push can never hide an earlier failure.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            code_files=$(printf '%s\n' "$changed" | grep -vE '^(openspec/|docs/)|\.md$' | grep . || true)
            previous=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?check_name=quality" --jq '.check_runs[0].conclusion' 2>/dev/null || true)
            if [ -n "$changed" ] && [ -z "$code_files" ] && { [ "$previous" = success ] || [ "$previous" = skipped ]; }; then
              code=false
            fi
            echo "Changed since $BEFORE:"; printf '%s\n' "$changed"
            echo "Previous quality: ${previous:-unknown}"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  quality:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # runtime: full monorepo (PATH_SOURCE = packages), not just an app/.
      # business: PATH_BUSINESS (packages/core) + packages/cli (DIS-86) + Stryker config + tests/**.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            runtime:
              - 'packages/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.dependency-cruiser.cjs'
              - 'vitest.config.*'
              - 'vitest.stryker.config.*'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - '.github/workflows/ci.yml'
            business:
              - 'packages/core/**'
              - 'packages/cli/**'
              - 'tests/**'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - 'vitest.stryker.config.*'
              - 'package-lock.json'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The dependency rule is the central assertion of a hexagonal
      # architecture. Without this step it is a promise; with it, it is a constraint.
      - name: Dependency rule (core does not import infrastructure)
        run: npx depcruise --config .dependency-cruiser.cjs packages

      - name: Migrations (apply and roll back)
        if: steps.changes.outputs.runtime == 'true'
        run: npm run db:migrate && npm run db:rollback && npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      - name: Tests
        if: steps.changes.outputs.runtime == 'true'
        run: npx vitest run
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      # The hard gate is the mutation score, not coverage: requiring a coverage
      # percentage fabricates empty tests. Coverage is published as a signal.
      # Skips cleanly until the first test exists: Stryker's dry run fails with
      # zero tests, and fabricating an empty test to force it green is exactly
      # what this gate is meant to prevent. It self-activates once tests land.
      # tests/integration/** is ignored here and in Stryker's own vitest config
      # (vitest.stryker.config.ts): those specs need Postgres, which this step
      # does not have, and they cannot kill mutants in packages/core.
      - name: Mutation testing on critical paths
        if: steps.changes.outputs.business == 'true'
        run: |
          if find packages tests -path tests/integration -prune -o \( -name '*.test.*' -o -name '*.spec.*' \) -print 2>/dev/null | grep -q .; then
            npx stryker run
          else
            echo "WARNING: no test files yet — skipping mutation testing until tests exist (Ticket 1/2)."
          fi

  # Secret scan with gitleaks (DIS-87). Its own job on purpose: it has no `needs: scope` and no `if`,
  # because `scope` skips `quality` on docs-only pushes and a secret pasted into a `.md` is exactly
  # what this job must catch. No `npm ci`: a fresh checkout has no node_modules or untracked files
  # for `gitleaks dir` to trip on. Known synthetic findings are fingerprinted in `.gitleaksignore`
  # (see fixtures/README.md). Event values reach the shell through `env:`, never inside `run:`.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official release binary, checked against the SHA-256 of the release checksums.txt, written
      # here (never downloaded in the same step). Installed outside the checkout so `dir .` does not
      # scan it.
      - name: Install gitleaks 8.30.1 (pinned SHA-256)
        id: install
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}"
          echo "${SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # PR: base..head. Push to main: before..sha, or tree only when `before` is all zeros (first
      # push) or not a reachable commit (force-push). Never fails for lack of a range.
      - name: Commit range of this event
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range=
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ "$EVENT" = push ]; then
            if printf '%s' "$BEFORE" | grep -qE '^0+$' || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No usable 'before' commit (${BEFORE:-none}): tree scan only"
            else
              range="$BEFORE..$SHA"
            fi
          else
            echo "Event $EVENT has no commit range: tree scan only"
          fi
          echo "range=$range" | tee -a "$GITHUB_OUTPUT"

      - name: Scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner -v

      # Runs even when the tree scan failed, so one run reports both modes.
      - name: Scan commits of the event
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.range.outputs.range != '' }}
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner -v --log-opts="$RANGE"
