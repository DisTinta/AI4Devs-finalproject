services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemind}
      POSTGRES_DB: ${POSTGRES_DB:-codemind}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codemind} -d ${POSTGRES_DB:-codemind}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
