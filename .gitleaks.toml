# gitleaks configuration (DIS-87, design D10 of openspec change ci-secret-scan).
# Default rules, plus allowlists for the known synthetic findings of the working tree. Each entry
# is bound to its exact matched value (no paths: gitleaks 8.30.1 applies global allowlist paths as
# a whole-file skip in dir mode, even with condition = "AND"), so any other value on the same line
# or anywhere else is still reported. Values are escaped (a backslash before each
# dash of a PEM header, one bracketed character in short values, and every non-ASCII character as
# an RE2 code-point escape, so the file stays ASCII) so this file does not match the
# 8.30.1 needs to match it) so this file does not match the
# rules itself. Regeneration: fixtures/README.md, section "CI secret scan".

[extend]
useDefault = true

[[allowlists]]
description = "Old fake fixture value quoted in a session log - docs/ai-sessions/01-revision-fixtures-y-prompt-correccion.md, aws-access-token, line 116 when generated"
regexes = ['''^A[K]IAJ7FAKEFIXTURE42Q$''']

[[allowlists]]
description = "Planted synthetic AWS-shaped value of the acme-shop fixture (fixtures/README.md) - fixtures/acme-shop/config/services.php, aws-access-token, line 21 when generated"
regexes = ['''^A[K]IAQSTCFM2KN7BXPWZR$''']

[[allowlists]]
description = "Planted synthetic fallback value of the task-api fixture (fixtures/README.md) - fixtures/task-api/src/config/env.ts, generic-api-key, line 7 when generated"
regexes = ['''^A[K]IAM3VXTQ9CZJY6WNKP$''']

[[allowlists]]
description = "Example PEM block in the archived security-gateway spec (synthetic) - openspec/changes/archive/2026-10-05-security-gateway/specs/security-gateway/spec.md, private-key, line 118 when generated"
regexes = ['''^\-\-\-\-\-BEGIN PRIVATE KEY\-\-\-\-\-`; three base64 body lines\n  `MIIBVQIBADANBgkqhkiG9w0BAQEFAASCAT8wggE7AgEAAkEA`,\n  `sintetico\-no\-es\-una\-clave\-real`, `ZmFrZQ==`; and `return 1;` \(synthetic literals built\n  by concatenation in the test\)\n\- \*\*WHEN\*\* it is redacted\n\- \*\*THEN\*\* line 2 is the marker, lines 3\x{2013}5 are empty, line 6 is still `return 1;` and the content has\n  6 lines\n\- \*\*AND\*\* `events` is exactly\n  `\[\{ type: 'secret_redacted', file: 'nokey\.php', line: 2, column: 1, rule: 'private\-key' \}\]`\n\n#### Scenario: A single\-line private key keeps the surrounding JSON\n\n\- \*\*GIVEN\*\* `service\-account\.json` with 5 lines: `\{`; `  "type": "service_account",`;\n  `  "private_key": "\-\-\-\-\-BEGIN PRIVATE KEY\-\-\-\-\-$''']

[[allowlists]]
description = "Example PEM block in the archived security-gateway spec (synthetic) - openspec/changes/archive/2026-10-05-security-gateway/specs/security-gateway/spec.md, private-key, line 118 when generated"
regexes = ['''^\-\-\-\-\-BEGIN PRIVATE KEY\-\-\-\-\-`; three base64 body lines\n  `MIIBVQIBADANBgkqhkiG9w0BAQEFAASCAT8wggE7AgEAAkEA`,\n  `c2ludGV0aWNvLW5vLWVzLXVuYS1jbGF2ZS1yZWFs`, `ZmFrZQ==`; and `return 1;` \(synthetic literals built\n  by concatenation in the test\)\n\- \*\*WHEN\*\* it is redacted\n\- \*\*THEN\*\* line 2 is the marker, lines 3\x{2013}5 are empty, line 6 is still `return 1;` and the content has\n  6 lines\n\- \*\*AND\*\* `events` is exactly\n  `\[\{ type: 'secret_redacted', file: 'nokey\.php', line: 2, column: 1, rule: 'private\-key' \}\]`\n\n#### Scenario: A single\-line private key keeps the surrounding JSON\n\n\- \*\*GIVEN\*\* `service\-account\.json` with 5 lines: `\{`; `  "type": "service_account",`;\n  `  "private_key": "\-\-\-\-\-BEGIN PRIVATE KEY\-\-\-\-\-$''']

